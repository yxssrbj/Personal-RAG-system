services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./db:/app/db

volumes:
  ollama_models:
